name: Check

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run check
            - run: npm run build
            - run: npm run test:e2e
              env:
                  PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
            - name: Check development interactions
              run: npm run test:e2e
              env:
                  PLAYWRIGHT_DEV: '1'
                  PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: browser-test-results
                  path: test-results/
                  retention-days: 7
