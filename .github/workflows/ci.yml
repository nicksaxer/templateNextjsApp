name: Check

on:
    push:
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run check
            - run: npm run build
            - name: Check Docker deployment and version
              run: |
                  export APP_IMAGE=template-nextjs-app
                  version=$(node -p "require('./package.json').version")
                  image=$(docker compose config --images)
                  test "$image" = "$APP_IMAGE:$version"
                  docker build --build-arg "APP_VERSION=$version" --tag "$image" .
                  export APP_NETWORK_NAME=caddy-check APP_NETWORK_EXTERNAL=true
                  docker network create "$APP_NETWORK_NAME"
                  trap 'docker compose down; docker network rm "$APP_NETWORK_NAME"' EXIT
                  docker compose up -d --pull never --wait --wait-timeout 90 || { docker compose logs; exit 1; }
                  container=$(docker compose ps -q)
                  test "$(docker inspect --format '{{.Config.Image}}' "$container")" = "$image"
                  test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$container")" = "$version"
                  service=$(docker compose config --services)
                  docker run --rm --network "$APP_NETWORK_NAME" "$image" node -e 'fetch(process.argv[1]).then(response => {if (!response.ok) process.exit(1);}).catch(() => process.exit(1));' "http://$service:3000/api/health"
                  html=$(curl -fsS http://127.0.0.1:3000)
                  grep -Fq "v$version</footer>" <<< "$html"
                  grep -Fq 'id="mail"' <<< "$html"
            - run: npm run test:e2e
              env:
                  PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
            - name: Check development interactions
              run: npm run test:e2e
              env:
                  PLAYWRIGHT_DEV: '1'
                  PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: browser-test-results
                  path: test-results/
                  retention-days: 7

    publish-image:
        needs: check
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
            - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
              with:
                  platforms: arm64
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
            - name: Publish the versioned image to GHCR
              env:
                  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  export APP_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
                  version=$(node -p "require('./package.json').version")
                  image=$(docker compose config --images)
                  test "$image" = "$APP_IMAGE:$version"
                  printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
                  docker buildx build --platform linux/amd64,linux/arm64 --push \
                      --build-arg "APP_VERSION=$version" \
                      --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
                      --label "org.opencontainers.image.revision=$GITHUB_SHA" \
                      --tag "$image" .
                  docker buildx imagetools inspect "$image"
                  trap 'docker compose down' EXIT
                  docker compose up -d --wait --wait-timeout 90 || { docker compose logs; exit 1; }
                  html=$(curl -fsS http://127.0.0.1:3000)
                  grep -Fq "v$version</footer>" <<< "$html"
