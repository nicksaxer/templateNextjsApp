name: Check

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run check
            - run: npm run build
            - name: Check Docker deployment and version
              run: |
                  trap 'docker compose -f compose.portainer.yaml down' EXIT
                  docker compose up -d --build --wait --wait-timeout 90 || { docker compose logs; exit 1; }
                  built=$(docker inspect --format '{{.Image}}' "$(docker compose ps -q app)")
                  docker compose down
                  docker compose -f compose.portainer.yaml up -d --wait --wait-timeout 90 || { docker compose -f compose.portainer.yaml logs; exit 1; }
                  version=$(node -p "require('./package.json').version")
                  container=$(docker compose -f compose.portainer.yaml ps -q app)
                  image=$(docker inspect --format '{{.Config.Image}}' "$container")
                  test "$(docker inspect --format '{{.Image}}' "$container")" = "$built"
                  test "${image##*:}" = "$version"
                  test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$container")" = "$version"
                  html=$(curl -fsS http://127.0.0.1:3000)
                  grep -Fq "v$version</footer>" <<< "$html"
                  grep -Fq 'id="mail"' <<< "$html"
            - run: npm run test:e2e
              env:
                  PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
            - name: Check development interactions
              run: npm run test:e2e
              env:
                  PLAYWRIGHT_DEV: '1'
                  PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: browser-test-results
                  path: test-results/
                  retention-days: 7
