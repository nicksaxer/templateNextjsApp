services:
    app:
        image: template-nextjs-app:0.1.0 # Managed by npm version
        pull_policy: build
        build:
            context: .
            dockerfile: Dockerfile
            args:
                APP_VERSION: '0.1.0'
        restart: unless-stopped
        ports:
            - "${APP_PORT:-3000}:3000"
        environment:
            MONGODB_URI: "${MONGODB_URI:-}"
            SMTP_HOST: "${SMTP_HOST:-}"
            SMTP_PORT: "${SMTP_PORT:-587}"
            SMTP_SECURE: "${SMTP_SECURE:-false}"
            SMTP_USER: "${SMTP_USER:-}"
            SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
            SMTP_FROM: "${SMTP_FROM:-}"
        healthcheck:
            test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(response => {if (!response.ok) process.exit(1);}).catch(() => process.exit(1));"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 15s
