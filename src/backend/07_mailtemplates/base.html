<!doctype html>
<html lang="en">
    <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{subject}}</title></head>
    <body style="margin:0;background:#f2f3f5;font-family:Arial,Helvetica,sans-serif;color:#25272d;line-height:1.6;">
        <table role="presentation" style="width:100%;border-collapse:collapse;"><tr><td style="padding:32px 16px;">
            <table role="presentation" style="max-width:560px;width:100%;margin:auto;background:#ffffff;border:1px solid #e4e5e9;border-radius:16px;border-spacing:0;">
                <tr><td style="padding:28px 32px;border-bottom:1px solid #e4e5e9;">{{> header}}</td></tr>
                <tr><td style="padding:32px;">{{{content}}}</td></tr>
                <tr><td style="padding:24px 32px;border-top:1px solid #e4e5e9;">{{> footer}}</td></tr>
            </table>
        </td></tr></table>
    </body>
</html>
