<!doctype html>
<html lang="en">
    <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{subject}}</title></head>
    <body style="font-family:Segoe UI,Helvetica,sans-serif;background-color:#f0f0f0;color:#333333;margin:0;padding:0;line-height:1.5;">
        <table role="presentation" style="width:100%;border-spacing:0;"><tr><td style="padding:20px;">
            <table role="presentation" align="center" style="max-width:600px;width:100%;margin:auto;background:#ffffff;padding:20px 20px 0;border-radius:10px;border-spacing:0;">
                <tr><td style="padding:20px;text-align:center;background:#0096a8;color:white;border-radius:6px;">{{> header}}</td></tr>
                <tr><td style="padding:20px 20px 50px;">{{{content}}}</td></tr>
                <tr><td style="text-align:center;padding:15px 15px 20px;border-top:1px solid #dddddd;">{{> footer}}</td></tr>
            </table>
        </td></tr></table>
    </body>
</html>
